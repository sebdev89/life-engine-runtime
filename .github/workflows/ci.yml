name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (java 21, ubuntu)
    # Runner propio, usuario `le-ci` — sin grupo docker, sin acceso a prod/.
    #
    # Nota para quien lea esto mas adelante: este repo es PUBLICO, asi que en los
    # runners de GitHub corre gratis e ilimitado y es el unico de la plataforma cuyo
    # CI nunca se cayo por facturacion. Se mueve igual para que los cuatro repos del
    # lane compartan runner y politica, y porque asi el fallback queda probado: si el
    # host se cae, volver a los runners de GitHub en este repo es gratis de verdad.
    runs-on: [self-hosted, le-ci]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn -v

      # ---------------------------------------------------------------------------
      # Compile gate — fast feedback before the test lane runs.
      # ---------------------------------------------------------------------------
      - name: Compile (main + test sources)
        run: mvn -B -ntp -DskipTests test-compile

      # ---------------------------------------------------------------------------
      # Default test lane.
      #
      # The unit/WebFlux suite is fully hermetic: persistence is forced to the
      # in-memory RunStore via application-test.yml and LLM calls use MockWebServer
      # so no PostgreSQL / vLLM is required here.
      #
      # The R2DBC integration test (R2dbcRunStoreTest) starts an ephemeral
      # postgres:16-alpine via Testcontainers when a Docker daemon is reachable.
      # En los runners de GitHub el daemon venia dado. En el runner `le-ci` el unico
      # daemon accesible es su Docker rootless: DOCKER_HOST lo inyecta la unidad
      # systemd del runner y Testcontainers lo autodetecta por XDG_RUNTIME_DIR.
      # Testcontainers falla rapido si no hay daemon — NO se saltea en silencio; un
      # opt-out seria un cambio deliberado de workflow y no un verde accidental.
      # ---------------------------------------------------------------------------
      - name: Verificar que el daemon disponible es el rootless
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<no seteado>}"
          docker info --format 'root dir: {{.DockerRootDir}} · {{.SecurityOptions}}'
          docker info --format '{{.SecurityOptions}}' | grep -q 'name=rootless' || {
            echo "::error::el daemon visible no es rootless — Testcontainers no debe correr acá"
            exit 1
          }

      - name: Run tests (mvn test)
        run: mvn -B -ntp test

      # ---------------------------------------------------------------------------
      # On failure: publish Surefire reports so the failing test, stack trace, and
      # captured runtime logs are recoverable from the run summary.
      # ---------------------------------------------------------------------------
      - name: Upload Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/**
            target/site/surefire-report.html
          if-no-files-found: ignore
          retention-days: 14

  docker-publish:
    name: docker build + push
    runs-on: [self-hosted, le-ci]
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    # Expose the published artifact's identity (KAN-200 / T9) so the deploy can consume it from the
    # Actions API without resolving it by hand. Not secret — repository/tag/digest/revision are public
    # facts of the pushed image.
    outputs:
      repository: ${{ steps.image-metadata.outputs.repository }}
      tag: ${{ steps.image-metadata.outputs.tag }}
      digest: ${{ steps.image-metadata.outputs.digest }}
      revision: ${{ steps.image-metadata.outputs.revision }}
      commit: ${{ steps.image-metadata.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable sha- tags only. 'latest' is a moving pointer and is banned across the platform
      # (KAN-193 no-latest guard); deploys resolve by digest/sha, never by latest. metadata-action still
      # stamps org.opencontainers.image.revision=<sha> into the labels, so the image keeps its OCI revision.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Real git identity for /actuator/info: the build context has no .git, so pass it explicitly.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # KAN-200 / T9: publish the digest of the image we just pushed. build-push-action reports the
      # immutable digest in steps.build.outputs.digest — surface it as job outputs (Actions API /
      # downstream jobs) and in the run summary (gh run view), so deploy-uat.sh can resolve
      # commit -> digest straight from the run instead of querying GHCR by hand. No credentials here.
      - name: Expose published image digest
        id: image-metadata
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          short="${GITHUB_SHA:0:7}"
          repository="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          tag="sha-${short}"
          {
            echo "repository=${repository}"
            echo "tag=${tag}"
            echo "digest=${DIGEST}"
            echo "revision=${GITHUB_SHA}"
            echo "commit=${short}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Published image"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| repository | \`${repository}\` |"
            echo "| tag | \`${tag}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| oci.revision | \`${GITHUB_SHA}\` |"
            echo "| commit | \`${short}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
