spring:
  application:
    name: life-engine-runtime

  # life-engine-runtime owns DB `life_engine_runtime` (schema `public`). See
  # ../life-engine/docs/operations/11-database-ownership.md for the canonical matrix.
  #
  # R2DBC drives RunStore reads/writes; JDBC + Flyway runs migrations at boot.
  # Set `lifeengine.runtime.persistence.type=inmem` to disable persistence and
  # fall back to InMemoryRunStore (no DB required) — used by tests and local
  # dev without PostgreSQL.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/life_engine_runtime}
    username: ${SPRING_DATASOURCE_USERNAME:life}
    password: ${SPRING_DATASOURCE_PASSWORD:life}

  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5433/life_engine_runtime}
    username: ${SPRING_R2DBC_USERNAME:life}
    password: ${SPRING_R2DBC_PASSWORD:life}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5433/life_engine_runtime}
    user: ${SPRING_FLYWAY_USER:life}
    password: ${SPRING_FLYWAY_PASSWORD:life}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  # BuildIdentityConfig owns /actuator/info in the exact shape of LIFE-OPS-02 §2.2. The stock env/git/build
  # contributors are disabled so they cannot pollute or reshape that contract (KAN-195).
  info:
    env:
      enabled: false
    git:
      enabled: false
    build:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

lifeengine:
  # Deployment environment for build identity (/actuator/info) and metric common tags. From APP_ENV —
  # never hardcoded per environment (KAN-195 / §2.2).
  deployment:
    env: ${APP_ENV:local}
  runtime:
    fake-workflow:
      step-delay-ms: 50
    # Persistence backend: `r2dbc` (default, requires PostgreSQL + Flyway) or
    # `inmem` (volatile, no DB). Tests force `inmem` via application-test.yml.
    persistence:
      # Env var name matches Spring Boot's relaxed-binding form of
      # `lifeengine.runtime.persistence.type` so `LIFEENGINE_RUNTIME_PERSISTENCE_TYPE=inmem`
      # works whether it is set as a placeholder substitution here OR as a direct
      # property override at process boot.
      type: ${LIFEENGINE_RUNTIME_PERSISTENCE_TYPE:r2dbc}
    security:
      enabled: ${RUNTIME_SECURITY_ENABLED:true}
      # Phase-1 bridge: mint RUNTIME_VIEWER/OPERATOR/ADMIN from the JWT `role` claim and
      # ROLE_ADMIN. Required until life-engine-auth seeds RUNTIME_* in auth_role_permission
      # (tracked in docs/extraction/local-runbook.md). Set to `false` once the auth
      # Flyway migration ships proper RUNTIME_* permissions.
      derive-runtime-authorities-from-role: ${RUNTIME_DERIVE_AUTHORITIES_FROM_ROLE:true}
      jwks:
        uri: ${AUTH_JWKS_URI:}
      # KAN-173 — contrato exigido a los tokens service-to-service.
      #
      # El issuer NO tiene default: sin AUTH_S2S_ISSUER configurado, ServiceTokenGuard rechaza
      # todos los tokens de servicio. Es preferible que los flujos S2S fallen a que acepten
      # cualquier issuer porque alguien olvidó una variable — un token del Auth de UAT no debe
      # servir en prod aunque la firma sea válida.
      #
      # La audiencia es fija por servicio, no configurable por ambiente: `runtime` ES este
      # servicio. Un token emitido para RAG se rechaza acá aunque venga del mismo Auth.
      service-tokens:
        expected-issuer: ${AUTH_S2S_ISSUER:}
        expected-audience: runtime
        allowed-subjects: ${RUNTIME_S2S_ALLOWED_SUBJECTS:service:business-chat}
        allowed-client-ids: ${RUNTIME_S2S_ALLOWED_CLIENT_IDS:business-chat}
        # Business Chat llama /api/runtime/** (arrancar runs, agregar eventos), que exige
        # OPERATOR. No se le da ADMIN: habilita operaciones que nunca necesita, y darla "por
        # las dudas" convierte un compromiso de Business Chat en control total del Runtime.
        required-authority: ${RUNTIME_S2S_REQUIRED_AUTHORITY:RUNTIME_OPERATOR}
  security:
    jwt:
      # Local default MUST match life-engine-auth/src/main/resources/application-local.yml so
      # that auth-issued JWTs validate at the runtime without an explicit JWT_SECRET export.
      # Override via JWT_SECRET in any non-local environment.
      secret: ${JWT_SECRET:local-dev-jwt-hs512-secret-minimum-32-chars-long-xx}

runtime:
  llm:
    base-url: http://localhost:8000
    model: Qwen/Qwen2.5-Coder-3B-Instruct
    api-key: local-dev
    timeout: 30s
    # Techo de generación. Es un LÍMITE, no una reserva: se paga sólo lo que el modelo
    # realmente genera, así que subirlo no cuesta latencia ni memoria en el camino normal.
    #
    # El 192 anterior estaba dimensionado para un vLLM con qwen2.5-coder-3b que ya no corre en
    # ningún ambiente. Contra el modelo del rol chat de hoy (qwen3:14b) rompía
    # business-chat.reply.v1 en el 100% de los casos: el modelo se va en un bloque de
    # razonamiento, choca contra el techo y devuelve contenido vacío. El agente muere con
    # `empty LLM response` y el visitante lee "tuve un problema técnico". El modo json_object
    # de KAN-B1 NO alcanza para evitarlo — se verificó con el response-format activo.
    #
    # Medido contra Ollama, tres mensajes distintos por corrida (precio, multi-pregunta, handoff):
    #
    #    192   business-chat  0/3 OK   completion_tokens == 192, clavado en el techo
    #    512   business-chat  1/3 OK   completion_tokens == 512, clavado en el techo
    #   1024   business-chat  6/6 OK   máximo real observado: 151
    #   2048   business-chat  9/9 OK   máximo real observado: 104
    #   4096   business-chat  3/3 OK   máximo real observado: 101
    #
    # En 21 llamadas exitosas ninguna pasó de 151 tokens: el techo no lo fija la demanda real
    # sino el caso patológico de razonamiento desbocado. Por eso NO se elige el mínimo que pasa
    # (1024): la frontera es probabilística —512 se desbocó donde 1024 no— y no hay razón de
    # principio para creer que 1024 esté a salvo.
    #
    # 2048 es además el valor efectivo que YA corre en prod y UAT vía .env desde hace semanas.
    # Ponerlo acá de default no cambia ningún ambiente desplegado: alinea el default con lo
    # único que tiene evidencia de campo y elimina las capas intermedias que no la tienen.
    max-tokens: ${RUNTIME_LLM_MAX_TOKENS:2048}
    # Los diez agentes que llaman al LLM parsean con StrictAgentJson; ninguno consume prosa.
    # Pedírselo al proveedor en vez de sólo al prompt es lo que todos ya exigen. Vaciar la
    # variable (o ponerla en `none`) vuelve al comportamiento anterior.
    response-format: ${RUNTIME_LLM_RESPONSE_FORMAT:json_object}
    temperature: 0
    # Endpoints por rol (ADR-ML-001 fase 1). Todo campo que no se declare acá hereda de
    # `runtime.llm` de arriba — la precedencia es rol > default, sin excepciones.
    #
    # Los defaults apuntan a Ollama y NO a `runtime.llm.base-url`: el default global sigue
    # apuntando a vLLM :8000 por compatibilidad, y cambiarlo es otro frente. Un rol sin
    # variables de entorno seteadas queda igual que antes de este cambio en todo lo demás.
    roles:
      chat:
        base-url: ${RUNTIME_LLM_CHAT_BASE_URL:http://localhost:11434}
        model: ${RUNTIME_LLM_CHAT_MODEL:gemma3:4b}
      fast:
        base-url: ${RUNTIME_LLM_FAST_BASE_URL:http://localhost:11434}
        model: ${RUNTIME_LLM_FAST_MODEL:gemma3:4b}

# Build identity overrides. Empty by default: local and CI builds carry a .git directory, so git.properties
# (git-commit-id) is the source. The Docker image has no .git — CI passes these as build-args → env, and
# BuildIdentityResolver prefers them. Never a secret.
identity:
  git:
    commit: ${GIT_COMMIT:}
    branch: ${GIT_BRANCH:}
    commit-time: ${GIT_COMMIT_TIME:}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-},%X{correlationId:-},%X{runId:-},%X{workflowId:-}]"
